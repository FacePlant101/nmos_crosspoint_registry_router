# Build + push the NMOS Crosspoint Docker image.
#
# Triggers:
#   - every push to master  -> :latest, :<version-from-package.json>, :master-<sha>
#   - git tag `v*`          -> :<tag-without-leading-v>, :latest
#   - manual dispatch       -> same as a push to master
#
# Registry: GitHub Container Registry (ghcr.io/<owner>/<repo>), which
# authenticates with the built-in GITHUB_TOKEN. No secrets to configure — the
# image lands next to the repo and inherits its visibility. (The upstream fork
# publishes to Docker Hub instead; to do that, swap the login step for
# docker/login-action with a DOCKERHUB_TOKEN secret and change `images:` below.)

name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Read the version out of server/package.json so the published tag
      # matches what the running container reports on the Setup page.
      - name: Extract version from server/package.json
        id: version
        run: |
          v=$(jq -r .version server/package.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Image version: $v"

      # QEMU provides the arm64 emulation the prod-deps stage needs. The JS
      # build stages run natively — see the Dockerfile header.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag set per trigger:
      #   push to master   : :latest + :<version> + :master-<sha7>
      #   tag push v2.1.0  : :2.1.0  + :latest
      - name: Docker tags / labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha,prefix=master-,format=short,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Multi-arch: amd64 (servers) + arm64 (Raspberry Pi, Apple Silicon, ARM
      # cloud instances). arm64 is affordable because the Dockerfile pins
      # vite/tsc to $BUILDPLATFORM, so only the production npm ci is emulated.
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Buildx GHA cache keeps npm ci + tsc + vite results between runs, so
          # source-only changes finish in a few minutes instead of ten-plus.
          cache-from: type=gha
          cache-to: type=gha,mode=max
