global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # NMOS Crosspoint Router metrics
  - job_name: 'nmos-crosspoint'
    static_configs:
      - targets: ['localhost:80']
    metrics_path: '/api/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    params:
      format: ['prometheus']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana self-monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['localhost:3000']

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

