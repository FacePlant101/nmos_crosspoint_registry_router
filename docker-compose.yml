version: '2.4'

services:

  # Create NMOS Registry/Controller container instance
  nmos-crosspoint:
    build: 
      context: './'
    container_name: nmos-crosspoint_v2
    hostname: nmos-crosspoint_v2
    domainname: local
    network_mode: host
    volumes:
    # Bind-mounted, NOT baked into the image. The build context no longer
    # includes server/config (it holds password hashes and device
    # credentials), and the entrypoint seeds settings.json + users.json from
    # the image's config.default on first boot if this directory is empty.
    - ./server/config:/nmos-crosspoint/server/config
    - nmos-state:/nmos-crosspoint/server/state
    # Added depends_on for startup order (optional but good practice)
    depends_on:
      - nmos-registry
    restart: unless-stopped # Added restart policy

  nmos-registry:
    # image: rhastie/nmos-cpp:latest
    # image: nvcr.io/nvidia/holoscan-for-media/nmos-cpp:0.4.0
    build:
      context: .
      dockerfile: Dockerfile.registry
    container_name: nmos-registry
    hostname: nmos-registry
    privileged: true # Added based on rhastie/nmos-cpp documentation
    network_mode: host
    restart: unless-stopped # Added restart policy
    environment:
      - RUN_NODE=FALSE
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
    # No volumes needed for basic registry operation
    labels:
      io.balena.features.dbus: '1'
    
  # ZeroTier gateway service
  zerotier:
    build:
      context: ./
      dockerfile: Dockerfile.zerotier.template
    privileged: true
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW
    volumes:
      - zerotier-data:/var/lib/zerotier-one
    restart: unless-stopped
    labels:
      io.balena.features.dbus: '1'
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket

  # Prometheus metrics collection
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    container_name: nmos-prometheus
    hostname: nmos-prometheus
    network_mode: host
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped
    depends_on:
      - nmos-crosspoint

  # Grafana visualization dashboard
  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    container_name: nmos-grafana
    hostname: nmos-grafana
    network_mode: host
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

  # InfluxDB for Proxmox metrics ingestion
  influxdb:
    image: influxdb:2.7
    container_name: nmos-influxdb
    hostname: nmos-influxdb
    network_mode: host
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=CHANGE_ME
      - DOCKER_INFLUXDB_INIT_PASSWORD=CHANGE_ME
      - DOCKER_INFLUXDB_INIT_ORG=CHANGE_ME
      - DOCKER_INFLUXDB_INIT_BUCKET=proxmox
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=CHANGE_ME
    volumes:
      - influxdb2-data:/var/lib/influxdb2
      - influxdb2-config:/etc/influxdb2
    restart: unless-stopped

volumes:
  nmos-state:
  zerotier-data:
  prometheus-data:
  grafana-data:
  influxdb2-data:
  influxdb2-config:
